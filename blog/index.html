<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme-v2');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
      // Each cover's sky follows the reader's clock, on Deni's hours. Set
      // before first paint, and read by CSS only, so the prerendered page and
      // React agree on the markup.
      var h = new Date().getHours();
      document.documentElement.dataset.sky =
        h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'afternoon' : h >= 17 && h < 22 ? 'evening' : 'night';
    </script>

    <title>Blog · Carl Macabales</title>
    <meta name="description" content="How the work got made: why each of Carl Macabales’s projects exists, what he tried, and what shipped." />
    <meta name="author" content="Carl Emmanuel Macabales" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://cemmacabales.com/blog/deni/og.jpg" />
    <meta name="theme-color" content="#ebefed" />

    <!-- Hovering a link renders the blog page it leads to ahead (Chrome,
         Edge), so it's ready to morph into when the click lands. The home is
         only fetched, and at once (one small document): rendering it ahead
         would start its WebGPU field. -->
    <script type="speculationrules">
      {
        "prerender": [{ "where": { "href_matches": "/blog/*" }, "eagerness": "moderate" }],
        "prefetch": [{ "where": { "href_matches": "/" }, "eagerness": "eager" }]
      }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {

          "@id": "https://cemmacabales.com/blog/#blog",
          "url": "https://cemmacabales.com/blog/",

          "isPartOf": { "@id": "https://cemmacabales.com/#website" },
          "author": { "@id": "https://cemmacabales.com/#carl" },

        },

          "@id": "https://cemmacabales.com/#carl",
          "name": "Carl Emmanuel Macabales",
          "url": "https://cemmacabales.com/"
        }
      ]
    }
    </script>
